name: Familiar Release

# Builds the Familiar Electron shell for every supported MVR target
# (macOS arm64, macOS x64, Linux x64) per designs/familiar-release.md G1.
#
# Triggers:
#   - pull_request and push to llm/master, gated by path filters so the
#     multi-platform build only runs when familiar / daemon / chat /
#     bundled-agent / build infrastructure code changes. Each run uploads
#     the per-platform `out/make/` output as a workflow artifact so the
#     maintainer can download and smoke-test releases manually from the
#     run's Artifacts panel.
#   - workflow_dispatch for ad-hoc manual builds (e.g., to smoke-test a
#     branch that did not trip the path filters).
#   - push of a `familiar-v*` tag, which additionally promotes the
#     artifacts into a draft GitHub Release via the `release` job below.
#
# The `release` job is gated on tag push or workflow_dispatch with an
# explicit version input; pull_request and branch-push runs never publish
# a release.

on:
  pull_request:
    paths:
      - 'packages/familiar/**'
      - 'packages/daemon/**'
      - 'packages/chat/**'
      - 'packages/lal/**'
      - 'packages/fae/**'
      - '.github/workflows/familiar-release.yml'
  push:
    branches:
      - llm
      - master
    paths:
      - 'packages/familiar/**'
      - 'packages/daemon/**'
      - 'packages/chat/**'
      - 'packages/lal/**'
      - 'packages/fae/**'
      - '.github/workflows/familiar-release.yml'
    tags:
      - 'familiar-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        type: string

permissions:
  contents: write

# Cancel in-progress runs for the same ref when a new run starts. The
# multi-platform make matrix is the longest-running CI surface in this
# repo; without this group a rapid sequence of pushes during familiar
# development queues up redundant macos-14/macos-13/ubuntu-latest builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Defense in depth against npm lifecycle scripts running implicitly at install.
# See designs/ci-no-npm-lifecycle.md.
env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

jobs:
  build-artifacts:
    name: Build bundles and chat dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build chat dist
        run: yarn workspace @endo/chat build

      - name: Bundle CLI and gateway
        run: yarn workspace @endo/familiar step:bundle

      - name: Upload chat dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-dist
          path: packages/chat/dist/

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: packages/familiar/bundles/

  make:
    name: Make (${{ matrix.target-os }}-${{ matrix.target-arch }})
    needs: build-artifacts
    runs-on: ${{ matrix.runner }}

    strategy:
      # Keep building the remaining platforms when one fails so the
      # maintainer can still pick up a partial artifact set for smoke
      # testing while the failing platform is investigated.
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target-os: darwin
            target-arch: arm64
          - runner: macos-13
            target-os: darwin
            target-arch: x64
          - runner: ubuntu-latest
            target-os: linux
            target-arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download chat dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chat-dist
          path: packages/chat/dist/

      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundles
          path: packages/familiar/bundles/

      - name: Download Node.js binary
        run: |
          cd packages/familiar
          ./scripts/download-node.sh v20.18.1 ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Prepare package
        run: |
          cd packages/familiar
          ./scripts/prepare-package.sh ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Make distributables
        run: yarn workspace @endo/familiar step:make

      - name: Upload make output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: familiar-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: packages/familiar/out/make/

  release:
    name: Create release
    needs: make
    runs-on: ubuntu-latest
    # Promote artifacts into a draft GitHub Release only when this run
    # was triggered by a `familiar-v*` tag push or by a workflow_dispatch
    # that supplied an explicit version input. Pull-request and
    # branch-push runs never enter this job; their artifacts stop at the
    # workflow run's Artifacts panel and remain downloadable for the
    # run's artifact-retention window.
    if: startsWith(github.ref, 'refs/tags/familiar-v') || github.event.inputs.version != ''

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          pattern: familiar-*

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=familiar-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Familiar ${{ steps.version.outputs.tag }}
          draft: true
          files: artifacts/**/*
